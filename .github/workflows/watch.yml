name: watch for new CVEs
on:
  schedule:
    - cron: "30 */6 * * *"  # every 6 hours
  workflow_dispatch:
permissions:
  contents: write        # push watch/* branches for draft PRs; main is only changed by a signed push
  issues: write
  pull-requests: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh label create queue --color 0e8a16 --description "CVE to add to the tool" --force
          gh label create zero-day --color b60205 --description "Vendor says it's exploited: add first" --force
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "amiaffected-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/watch.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The one-liner works from a datacenter IP (Cloudflare's Bot Fight Mode once 403'd every server)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://amiaffected.now/run)  # plain curl, default User-Agent, like a user
          [ "$code" = 200 ] && exit 0
          t="curl | sh one-liner blocked from servers"
          if [ "$(gh issue list --state open --search "\"$t\" in:title" --json number -q length)" = 0 ]; then
            gh issue create --title "$t" --body "Plain \`curl https://amiaffected.now/run\` from a GitHub runner got HTTP $code (checked $(date -u +%FT%TZ)). Servers in datacenters can't run the check. If the response has \`cf-mitigated: challenge\`, look at Cloudflare: Security → Bots → Bot Fight Mode, Security Level, and WAF custom rules."
          fi
          exit 1
      - name: The live release is signed by the release key
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          for f in secinspect.py advisories.json secinspect.py.sig advisories.json.sig; do
            curl -fsSL -A amiaffected "https://amiaffected.now/$f" -o "$d/$f" || true
          done
          python3 -c "import sys, secinspect as s; sys.exit(0 if s.release_signed(sys.argv[1]) else 1)" "$d" && exit 0
          t="Live release doesn't match its signatures"
          if [ "$(gh issue list --state open --search "\"$t\" in:title" --json number -q length)" = 0 ]; then
            gh issue create --title "$t" --body "The files served at amiaffected.now don't verify against the release key in secinspect.py (checked $(date -u +%FT%TZ)). Installed copies refuse updates until they do. If a release was pushed unsigned, sign it and push. If not, someone may have changed the site: compare the live files with the repo before anything else."
          fi
          exit 1
